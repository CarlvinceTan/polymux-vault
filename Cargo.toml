[package]
name = "vault-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vault"
path = "rust/main.rs"

[[bin]]
name = "vault-autofill-host"
path = "rust/autofill_host.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
getrandom = "0.4.3"
keepass = { version = "0.15", features = ["save_kdbx4"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem"] }
rust-argon2 = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3"
totp-rs = { version = "6", features = ["otpauth"] }
tungstenite = "0.30"
ureq = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
objc = "0.2"

[profile.release]
strip = true
lto = "thin"
